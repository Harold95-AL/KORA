<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KORA — Primer prototipo</title>
  </head>
  <body>
    <main>
      <h1>KORA</h1>
      <p>Un primer paso en un planeta desconocido.</p>
      <div class="scale-controls" aria-label="Comparación de escala del protagonista">
        <span>Altura provisional:</span>
        <button type="button" data-player-size="32" aria-pressed="true">32 px · tecla 1</button>
        <button type="button" data-player-size="40" aria-pressed="false">40 px · tecla 2</button>
        <label><input type="checkbox" id="show-collision" /> Mostrar colisión</label>
      </div>
      <div class="game-frame">
        <div id="game" aria-label="Prototipo de plataformas KORA"></div>
        <div class="game-hud">
          <h2>KORA <span>/ Escala del protagonista: <span id="player-scale">32 px</span></span></h2>
          <p id="player-health" role="status">Salud: 3 / 3</p>
          <p id="course-status" role="status">Avanza hacia la derecha · R: reiniciar</p>
        </div>
      </div>
      <p class="controls">Mover: A / D o flechas · Saltar: espacio o flecha arriba · J: golpe · K: disparo · R: reiniciar</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
