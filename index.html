<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KORA — Primer prototipo</title>
  </head>
  <body>
    <main>
      <h1>KORA</h1>
      <p>Un primer paso en un planeta desconocido.</p>
      <div class="game-frame">
        <div id="game" aria-label="Prototipo de plataformas KORA"></div>
        <div class="game-hud">
          <h2>KORA <span>/ Prueba de combate</span></h2>
          <p id="player-health" role="status">Salud: 3 / 3</p>
          <p id="course-status" role="status">Avanza hacia la derecha · R: reiniciar</p>
        </div>
      </div>
      <p class="controls">Mover: A / D o flechas · Saltar: espacio o flecha arriba · J: golpe · K: disparo · R: reiniciar</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
